<!DOCTYPE html>
<html>
<head>
    <title>Compose Mail</title>
</head>
<body>
    <h2>Compose Mail</h2>

    <p>
        <a href="{% url 'inbox' %}">Inbox</a> |
        <a href="{% url 'logout' %}">Logout</a>
    </p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send Mail</button>
    </form>
</body>
</html>
